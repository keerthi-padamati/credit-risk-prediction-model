services:
  - type: web
    name: credit-risk-prediction-model-mht3
    env: python
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python train.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: CORS_ORIGINS
        value: "*"
